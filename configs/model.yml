# 模型配置文件
model_root_path: "./models"
temperature: 0.8
llm_models: []  # 可用的LLM模型列表

# 本地模型配置
local_model_config:
  embed:   # 本地嵌入模型配置列表
    - name: "bge-large-zh-v1.5"
      model_path: "./models/bge-large-zh-v1.5"
  chat: []   # 本地聊天模型配置列表

# 在线模型配置 (智谱API作为默认配置)
online_llm_config:
   type: "openai-api"
   model_name: "qwen-plus"
   api_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Embedding模型配置
embedding_model_name: "bge-large-zh-v1.5"
embedding_device: "auto"  # 可选值: auto, cuda, mps, cpu, xpu

