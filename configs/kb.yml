# 知识库配置文件
# SQL数据库设置
database_type: "mysql"
username: "root"
password: "078814"
host: "localhost"
port: 3315

# 向量数据库设置
default_knowledge_base: ""
vector_search_top_k: 3
score_threshold: 1.0
chunk_size: 250
overlap_size: 50
kb_root_path: "./knowledge_base"

# 向量数据库配置 (使用Faiss作为默认配置)
vector_store:
  type: "faiss"
  cached_vs_num: 1
  cached_memo_vs_num: 1

# 文本切分器配置 (使用中文递归切分器作为默认配置)
text_splitter:
  type: "ChineseRecursiveTextSplitter"
  source: "huggingface"
  tokenizer_name_or_path: ""

# Embedding模型定制词语的词表文件
embedding_kword_file: "embedding_keywords.txt"

# 知识库信息
kb_info:
  name: "知识库介绍"
  samples: "关于本项目issue的解答"

